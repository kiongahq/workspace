name: CI

on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    uses: kiongahq/.github/.github/workflows/python.yml@76e4fed230c4f0b89b1bcf884df60e5b2fffca67
    with:
      install: pip install -r requirements-dev.txt
  jupyter:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    permissions: {contents: write, packages: write}
    with: {image: jupyter, dockerfile: jupyter/Dockerfile}
  ide:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    permissions: {contents: write, packages: write}
    with: {image: ide, dockerfile: ide/Dockerfile}
  langflow:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    permissions: {contents: write, packages: write}
    with: {image: langflow, dockerfile: langflow/Dockerfile}
  langflow-sidecar:
    needs: python
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    permissions: {contents: write, packages: write}
    with: {image: langflow-sidecar, dockerfile: langflow/Dockerfile.sidecar}
  langflow-smoke:
    if: github.event_name != 'pull_request' && (github.event_name != 'release' || !github.event.release.prerelease)
    needs: langflow
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Langflow canvas and check health
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/kiongahq/langflow:sha-${GITHUB_SHA::7}"
          if [ -n "$RELEASE_TAG" ]; then image="${image%:*}:${RELEASE_TAG#v}"; fi
          docker pull "$image"
          docker run -d --name kionga-langflow-smoke -p 127.0.0.1:7860:7860 \
            -e LANGFLOW_HOST=0.0.0.0 \
            -e LANGFLOW_AUTO_LOGIN=true \
            -e LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true \
            "$image"
          for attempt in {1..90}; do
            echo "Waiting for Langflow health (attempt $attempt/90)"
            if curl -fsS http://127.0.0.1:7860/health_check >/dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:7860/health_check >/dev/null; then
            docker logs kionga-langflow-smoke
            exit 1
          fi
          docker exec kionga-langflow-smoke python -c \
            'import importlib.util; p="/app/kionga-components/kionga/resources.py"; s=importlib.util.spec_from_file_location("kionga_resources", p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert all(getattr(m, name).name for name in ("KiongaDatasets", "KiongaDatasetObjects", "KiongaRegisteredStorage", "KiongaRegisteredObjects", "KiongaKnowledgeSearch"))'
